services:
  db:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - test-network

  # Hai container chay cung du an Spring hien tai de mo phong dinh tuyen.
  # Ten service khong tu tach controller HTML va REST API trong source code.
  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SERVER_PORT: 8095
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}

    expose:
      - "8095"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - test-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SERVER_PORT: 8095
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}

    expose:
      - "8095"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - test-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/deploy-test1.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - web
      - api

    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  mysql-data:
